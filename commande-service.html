<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander un service — Genius Electrical Service</title>
<link rel="stylesheet" href="css/style.css">
<script>(function(){var t=localStorage.getItem("ges_theme")||("dark");document.documentElement.setAttribute("data-theme", t);})();</script>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Demande de service</span>
      <h1>Commander un service</h1>
      <p>Décrivez votre besoin, nous vous contactons pour confirmer le rendez-vous.</p>
      <div class="breadcrumb"><a href="index.html">Accueil</a> / Commander</div>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:720px;">
      <div class="card">
        <div class="form-error-banner" id="formError"></div>
        <div class="form-success-banner" id="formSuccess"></div>
        <form id="serviceForm" novalidate>
          <div class="form-group">
            <label for="serviceType">Type de service *</label>
            <select id="serviceType" required></select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ville">Ville *</label>
              <input type="text" id="ville" placeholder="Ex : Douala" required>
              <div class="field-error" id="err-ville"></div>
            </div>
            <div class="form-group">
              <label for="quartier">Quartier *</label>
              <input type="text" id="quartier" placeholder="Ex : Bonamoussadi" required>
              <div class="field-error" id="err-quartier"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="adresse">Adresse précise *</label>
            <input type="text" id="adresse" placeholder="Ex : Rue 1.234, non loin de…" required>
            <div class="field-error" id="err-adresse"></div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="telephone">Téléphone *</label>
              <input type="tel" id="telephone" placeholder="6XXXXXXXX" required>
              <div class="field-error" id="err-telephone"></div>
            </div>
            <div class="form-group">
              <label for="date">Date souhaitée *</label>
              <input type="date" id="date" required>
              <div class="field-error" id="err-date"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="heure">Heure souhaitée *</label>
            <input type="time" id="heure" required>
            <div class="field-error" id="err-heure"></div>
          </div>

          <div class="form-group">
            <label for="description">Description du problème *</label>
            <textarea id="description" placeholder="Décrivez votre besoin ou le problème rencontré…" required></textarea>
            <div class="field-error" id="err-description"></div>
          </div>

          <div class="form-group">
            <label for="notes">Informations complémentaires (facultatif)</label>
            <textarea id="notes" placeholder="Précisions utiles pour notre équipe…"></textarea>
          </div>

          <div class="form-group">
            <label for="photo">Photo (facultatif)</label>
            <input type="file" id="photo" accept="image/*">
            <div class="file-preview" id="filePreview">
              <img id="previewImg" alt="Aperçu">
              <div>
                <div id="previewName" class="small" style="font-weight:600;"></div>
                <button type="button" class="remove-btn" id="removePhoto">Retirer</button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Envoyer la demande</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/config.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/service.js"></script>
</body>
</html>
