<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Genius Electrical Service</title>
<link rel="stylesheet" href="css/style.css">
<script>(function(){var t=localStorage.getItem("ges_theme")||(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");document.documentElement.setAttribute("data-theme", t);})();</script>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section" style="padding-top:56px;min-height:60vh;">
    <div class="container auth-shell">
      <div class="text-center mb-24">
        <span class="eyebrow">Espace client</span>
        <h1 style="font-size:1.8rem;">Connexion</h1>
        <p>Accédez à votre compte pour suivre vos commandes.</p>
      </div>
      <div class="auth-card">
        <div class="form-error-banner" id="formError"></div>
        <div class="auth-hint-banner" id="authHint"></div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="identifier">Email ou téléphone *</label>
            <input type="text" id="identifier" required>
            <div class="field-error" id="err-identifier"></div>
          </div>
          <div class="form-group">
            <label for="password">Mot de passe *</label>
            <div class="password-wrap">
              <input type="password" id="password" required>
              <button type="button" data-target="password">Afficher</button>
            </div>
            <div class="field-error" id="err-password"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>
        <p class="small text-center" style="margin-top:18px;">
          Pas encore de compte ? <a href="inscription.html" style="color:var(--navy-900);font-weight:600;">Créer un compte</a>
        </p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
